<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CHONK DOOM</title>
    <meta name="description" content="A DOOM-like FPS starring Le Chonk, and a harness that lets Mistral Large 4 play it by itself." />
    <link rel="icon" type="image/png" sizes="64x64" href="favicon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Pixelify+Sans:wght@400;500;600;700&family=Press+Start+2P&family=Fredoka:wght@400;500;600;700&family=Patrick+Hand&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app">
      <header>
        <div class="brand"><span class="logo">CHONK DOOM</span></div>
        <nav>
          <button id="btn-human" class="btn">🎮 Play yourself</button>
          <button id="btn-agent" class="btn hot">🐱 Let Le Chonk play</button>
          <button id="btn-sound" class="btn" title="Toggle sound (M)">🔊 SOUND ON</button>
          <a class="btn ghost" href="https://github.com/goums/chonk-doom" target="_blank" rel="noopener">GitHub</a>
        </nav>
      </header>

      <main>
        <section id="stage">
          <div id="screen-wrap">
            <canvas id="screen" width="384" height="240"></canvas>
            <div id="bubble" class="hidden"></div>
            <div id="thinking" class="hidden"><span class="paw">🐾</span> LE CHONK IS THINKING<span class="dots"></span><small>time is frozen</small></div>
            <div id="pause-overlay" class="hidden">
              <div class="pause-title">PAUSED</div>
              <button id="resume-btn" class="btn big">▶ Resume</button>
              <button id="quit-btn" class="btn">Quit to menu</button>
            </div>
          </div>
          <div id="stage-bar">
          <div id="help">
            <div class="keys"><span class="k"><kbd>↑</kbd><kbd>↓</kbd></span><span>move</span></div>
            <div class="keys"><span class="k"><kbd>←</kbd><kbd>→</kbd></span><span>turn</span></div>
            <div class="keys"><span class="k"><kbd class="wide">Space</kbd></span><span>shoot</span></div>
            <div class="keys"><span class="k"><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd><kbd>4</kbd></span><span>weapons</span></div>
            <div class="keys"><span class="k"><kbd>P</kbd></span><span>pause</span></div>
            <div class="keys hint"><span>walk into doors to open them</span></div>
          </div>
          <button id="pause-btn" class="btn hot big hidden" title="Pause (P)">⏸ PAUSE</button>
          </div>
        </section>

        <aside id="brain">
          <div class="panel-title">🧠 CHONK'S BRAIN <button id="brain-close" class="x" title="Close">✕</button></div>

          <details id="setup" open>
            <summary>Setup</summary>
            <label>Mistral API key
              <input id="api-key" type="password" placeholder="paste your key (kept in this browser only)" autocomplete="off" />
            </label>
            <div id="proxy-note" class="note hidden">✅ Dev proxy detected: using MISTRAL_STUDIO_API_KEY from .env (leave the field empty).</div>
            <div class="row">
              <label>Model <input id="model" value="mistral-large-4" /></label>
              <label>Difficulty
                <select id="difficulty">
                  <option value="0">Easy</option>
                  <option value="1" selected>Medium</option>
                  <option value="2">Hard</option>
                </select>
              </label>
            </div>
            <div class="row">
              <label>Observation
                <select id="obs">
                  <option value="vision">Vision only</option>
                  <option value="map" selected>Vision + automap</option>
                  <option value="radar">Vision + automap + radar</option>
                </select>
              </label>
              <label>Reasoning
                <select id="reasoning">
                  <option value="none">off (fast)</option>
                  <option value="high">high (slower, smarter)</option>
                </select>
              </label>
            </div>
            <div class="row">
              <label>Start level
                <select id="start-level">
                  <option value="0">E1M1 Le Salon</option>
                  <option value="1">E1M2 La Cuisine</option>
                  <option value="2">E1M3 La Cave (boss)</option>
                </select>
              </label>
              <label>Max turns <input id="max-turns" type="number" value="400" min="1" /></label>
            </div>
            <button id="agent-start" class="btn hot big">▶ START LE CHONK</button>
          </details>

          <div class="controls">
            <button id="agent-stop" class="btn small" disabled>⏹ Stop</button>
            <button id="agent-export" class="btn small" disabled>💾 Save log</button>
            <label class="speed">Speed
              <select id="speed"><option value="1">1x</option><option value="2">2x</option><option value="4">4x</option></select>
            </label>
          </div>

          <div id="stats" class="stats"></div>
          <div id="status" class="status">Ready. Press START.</div>
          <div id="log"></div>
        </aside>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
